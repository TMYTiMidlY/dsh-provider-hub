# Host-only login bridge. The separate Provider Hub preset owns web_search.
# Existing presets, tools and sessions keep their original behavior.
- insert:
    - id: dsh-web-search
      name: dsh-web-search
      config:
        tool: false
        defaultProvider: deepseek-official
        enabledProviders:
          - deepseek-official
          - openai-codex
          - zai
          - google-zread
        maxResults: 8
        timeoutMs: 60000
