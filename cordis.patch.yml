# One global augmentation route: official search always runs; switches add enhancements.
# Keep native tool schemas, presets, sessions and web_fetch.
# Explicit deployment environment/profile overrides remain authoritative.
- id: web
  config:
    searchProvider: !!js process.env.DSH_WEB_SEARCH_PROVIDER ?? 'dsh-provider-hub'
    fetchProvider: http

- insert:
    - id: dsh-provider-hub
      name: dsh-provider-hub
      config:
        searchProviders: [openai-codex]
        enabledProviders: [deepseek-official, openai-codex, zai, google-zread]
        timeoutMs: 60000
        quotaRecord: true
        quotaIntervalMinutes: 60
        quotaHistoryDays: 180
